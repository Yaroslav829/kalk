<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Калькулятор авто</title>
    <style>
        :root {
            --primary: #2563eb;
            --dark: #0f172a;
            --gray: #f8fafc;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background: #eff6ff;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        .main-card {
            background: #fff;
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow: hidden;
            margin: 10px auto;
        }

        .tabs {
            display: flex;
            background: var(--gray);
            padding: 6px;
            gap: 6px;
        }

        .tab {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }

        .tab.active { background: #fff; color: var(--primary); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }

        .p-20 { padding: 20px; }

        .field { margin-bottom: 16px; }
        
        label { 
            display: block; 
            font-size: 11px; 
            font-weight: 800; 
            color: #64748b; 
            text-transform: uppercase; 
            margin-bottom: 6px; 
            letter-spacing: 0.5px;
        }

        input, select {
            width: 100%;
            padding: 14px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 16px; /* Запобігає зуму в iOS */
            outline: none;
            background: #fff;
            appearance: none;
        }

        input:focus { border-color: var(--primary); }

        .res-box {
            background: var(--dark);
            color: #fff;
            padding: 24px;
            border-radius: 0 0 20px 20px;
        }

        .item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
            opacity: 0.9;
        }

        .item b { color: #fff; }

        .total-wrap {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px dashed rgba(255,255,255,0.2);
            text-align: center;
        }

        .total-label { font-size: 12px; font-weight: 600; opacity: 0.7; }
        .total-val { font-size: 32px; font-weight: 900; color: #60a5fa; display: block; }

        .btn-call {
            width: 100%;
            margin-top: 20px;
            padding: 16px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
        }

        @media (min-width: 480px) {
            .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
            .full { grid-column: span 2; }
        }
    </style>
</head>
<body>

<div class="main-card">
    <div class="tabs">
        <button id="t-usa" class="tab active" onclick="setMode('usa')">США ($)</button>
        <button id="t-eu" class="tab" onclick="setMode('eu')">Європа (€)</button>
    </div>

    <div class="p-20">
        <div class="grid">
            <div class="field full">
                <label id="l-price">Вартість авто</label>
                <input type="number" id="i-price" value="8500" oninput="upd()">
            </div>
            <div class="field">
                <label>Об'єм (см³)</label>
                <input type="number" id="i-eng" value="2000" oninput="upd()">
            </div>
            <div class="field">
                <label>Рік</label>
                <input type="number" id="i-yr" value="2019" oninput="upd()">
            </div>
            <div class="field">
                <label>Паливо</label>
                <select id="i-f" onchange="upd()">
                    <option value="p">Бензин</option>
                    <option value="d">Дизель</option>
                    <option value="e">Електро</option>
                </select>
            </div>
            <div class="field">
                <label>Кузов</label>
                <select id="i-b" onchange="upd()">
                    <option value="s">Седан</option>
                    <option value="v">SUV/Джип</option>
                </select>
            </div>
        </div>
    </div>

    <div class="res-box">
        <div class="item"><span>Митниця:</span><b id="o-tax">0</b></div>
        <div class="item"><span>Логістика:</span><b id="o-sh">0</b></div>
        <div class="item"><span>Реєстрація:</span><b id="o-rg">0</b></div>
        <div class="item"><span>Послуги:</span><b id="o-sv">0</b></div>

        <div class="total-wrap">
            <span class="total-label">ОРІЄНТОВНО ПІД КЛЮЧ</span>
            <span class="total-val" id="o-ttl">0</span>
        </div>
        
        <button class="btn-call">Отримати прорахунок</button>
    </div>
</div>

<script>
    let m = 'usa';
    const SV = 700;

    function setMode(v) {
        m = v;
        document.getElementById('t-usa').classList.toggle('active', v === 'usa');
        document.getElementById('t-eu').classList.toggle('active', v === 'eu');
        document.getElementById('l-price').innerText = v === 'usa' ? 'Вартість авто ($)' : 'Вартість авто (€)';
        upd();
    }

    function upd() {
        const p = parseFloat(document.getElementById('i-price').value) || 0;
        const e = parseFloat(document.getElementById('i-eng').value) || 0;
        const y = parseInt(document.getElementById('i-yr').value) || 2020;
        const f = document.getElementById('i-f').value;
        const b = document.getElementById('i-b').value;
        const age = Math.max(1, Math.min(15, new Date().getFullYear() - y));
        const cur = m === 'usa' ? '$' : '€';

        let tx = 0;
        if (f === 'e') {
            tx = (e / 1000) * 1;
        } else {
            let d = p * 0.10;
            let br = f === 'p' ? (e > 3000 ? 100 : 50) : (e > 3500 ? 150 : 75);
            let ex = br * (e / 1000) * age;
            tx = d + ex + ((p + d + ex) * 0.20);
        }

        let sh = m === 'usa' ? (p * 0.15 + (b === 'v' ? 1700 : 1350)) : 750;
        let rg = ((p + tx) * 0.04) + 180;

        document.getElementById('o-tax').innerText = Math.round(tx) + ' ' + cur;
        document.getElementById('o-sh').innerText = Math.round(sh) + ' ' + cur;
        document.getElementById('o-rg').innerText = Math.round(rg) + ' ' + cur;
        document.getElementById('o-sv').innerText = SV + ' ' + cur;
        document.getElementById('o-ttl').innerText = Math.round(p + tx + sh + rg + SV).toLocaleString() + ' ' + cur;
    }

    upd();
</script>

</body>
</html>
